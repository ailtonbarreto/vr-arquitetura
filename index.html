<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">

    <script src="menu.js" defer></script>
    <script src="hide.js" defer></script>

    <link
        rel="shortcut icon"
        href="vr-glasses.ico"
        type="image/x-icon"
    >

    <title>VR Arquitetura</title>

</head>

<body>


    <!-- ========================================================= -->
    <!-- MENU -->
    <!-- ========================================================= -->

    <span
        class="material-symbols-outlined open-menu hide"
        id="open_menu"
    >
        menu
    </span>


    <nav id="menu">

        <span
            class="material-symbols-outlined"
            id="close_menu"
        >
            close
        </span>


        <div id="modelButtons">

            <button
                class="model-btn"
                data-src="./construcao/edificio_1.glb"
            >
                Edifício 1
            </button>


            <button
                class="model-btn"
                data-src="./construcao/edificio_2.glb"
            >
                Edifício 2
            </button>


            <button
                class="model-btn"
                data-src="./construcao/casa_modelo_1.glb"
            >
                Casa Modelo 1
            </button>


            <button
                class="model-btn"
                data-src="./construcao/casa_modelo_2.glb"
            >
                Casa Modelo 2
            </button>


            <button
                class="model-btn"
                data-src="./construcao/eiffel_tower.glb"
            >
                Torre Eiffel
            </button>


            <button
                class="model-btn"
                data-src="./construcao/wtc.glb"
            >
                World Trade Center
            </button>


            <button
                class="model-btn"
                data-src="./construcao/Burj_al_arab.glb"
            >
                Burj Al Arab
            </button>

        </div>

    </nav>



    <!-- ========================================================= -->
    <!-- ZOOM -->
    <!-- ========================================================= -->

    <div class="controls-zoom hide">

        <div
            class="btn"
            id="zoomIn"
        >
            ＋
        </div>


        <div
            class="btn"
            id="zoomOut"
        >
            －
        </div>

    </div>



    <!-- ========================================================= -->
    <!-- ROTAÇÃO Y -->
    <!-- ========================================================= -->

    <div class="controls-bottom hide">

        <div
            class="btn"
            id="rotateRight"
        >
            ◀️
        </div>


        <div
            class="btn"
            id="rotateLeft"
        >
            ▶️
        </div>

    </div>



    <!-- ========================================================= -->
    <!-- ROTAÇÃO Z -->
    <!-- ========================================================= -->

    <div class="controls_rolagem hide">

        <div
            class="btn"
            id="rollLeft"
        >
            🔽
        </div>


        <div
            class="btn"
            id="rollRight"
        >
            🔼
        </div>

    </div>



    <!-- ========================================================= -->
    <!-- INCLINAÇÃO X -->
    <!-- ========================================================= -->

    <div class="controls-leftside hide">

        <div
            class="btn"
            id="tiltForward"
        >
            🔼
        </div>


        <div
            class="btn"
            id="tiltBackward"
        >
            🔽
        </div>

    </div>



    <!-- ========================================================= -->
    <!-- MOVIMENTO Y -->
    <!-- ========================================================= -->

    <div class="controls-side hide">

        <div
            class="btn"
            id="moveUp"
        >
            🔼
        </div>


        <div
            class="btn"
            id="moveDown"
        >
            🔽
        </div>

    </div>



    <!-- ========================================================= -->
    <!-- MOSTRAR / OCULTAR -->
    <!-- ========================================================= -->

    <div class="controls-zoom">

        <div
            class="material-symbols-outlined"
            id="ocultar"
        >
            visibility_off
        </div>


        <div
            class="material-symbols-outlined"
            id="mostrar"
            style="display: none;"
        >
            visibility
        </div>

    </div>



    <!-- ========================================================= -->
    <!-- BOTÃO AR -->
    <!-- ========================================================= -->

    <button
        id="startAR"
        style="
            position: fixed;
            z-index: 99999;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #2086EB;
            color: white;
            font-size: 16px;
        "
    >
        Iniciar realidade aumentada
    </button>



    <!-- ========================================================= -->
    <!-- BOTÃO COLOCAR -->
    <!-- ========================================================= -->

    <button
        id="placeObject"
        style="
            display: none;
            position: fixed;
            z-index: 99999;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #06A95D;
            color: white;
            font-size: 16px;
        "
    >
        Colocar modelo
    </button>



    <!-- ========================================================= -->
    <!-- A-FRAME -->
    <!-- ========================================================= -->

    <a-scene
        id="scene"

        vr-mode-ui="enabled: false"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "

        webxr="
            optionalFeatures:
            hit-test,
            local-floor,
            dom-overlay;
        "
    >


        <!-- ===================================================== -->
        <!-- MODELO -->
        <!-- ===================================================== -->

        <a-entity
            id="objeto"
            visible="false"
            position="0 0 -2"
            rotation="0 0 0"
        >

            <a-gltf-model
                id="modelo"
                src="./construcao/edificio_1.glb"
                scale="1 1 1"
            >
            </a-gltf-model>

        </a-entity>


        <!-- ===================================================== -->
        <!-- CÂMERA -->
        <!-- ===================================================== -->

        <a-camera
            id="camera"
            position="0 1.6 0"
        >
        </a-camera>


        <!-- LUZ -->
        <a-light
            type="ambient"
            intensity="1.5"
        ></a-light>


    </a-scene>



    <!-- ========================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================= -->

    <script>


        /* =========================================================
           ELEMENTOS
        ========================================================= */

        const scene =
            document.querySelector("#scene");


        const objeto =
            document.querySelector("#objeto");


        const modelo =
            document.querySelector("#modelo");


        const camera =
            document.querySelector("#camera");


        const startAR =
            document.querySelector("#startAR");


        const placeObject =
            document.querySelector("#placeObject");


        /* =========================================================
           ESTADO
        ========================================================= */

        let xrSession = null;

        let hitTestSource = null;

        let viewerSpace = null;

        let referenceSpace = null;

        let objetoColocado = false;

        let ultimaPose = null;


        let initialScale = 1;

        let pinchStartDistance = 0;



        /* =========================================================
           VERIFICAR WEBXR
        ========================================================= */

        async function verificarAR() {

            if (!navigator.xr) {

                alert(
                    "Este navegador não possui suporte ao WebXR."
                );

                return false;
            }


            try {

                const suportado =
                    await navigator.xr.isSessionSupported(
                        "immersive-ar"
                    );


                if (!suportado) {

                    alert(
                        "Este dispositivo não suporta realidade aumentada espacial."
                    );

                    return false;
                }


                return true;

            }
            catch (erro) {

                console.error(erro);

                return false;

            }

        }



        /* =========================================================
           INICIAR AR
        ========================================================= */

        startAR.addEventListener(
            "click",
            async () => {

                const suportado =
                    await verificarAR();


                if (!suportado) return;


                try {

                    xrSession =
                        await navigator.xr.requestSession(
                            "immersive-ar",
                            {
                                requiredFeatures: [
                                    "hit-test"
                                ],

                                optionalFeatures: [
                                    "local-floor",
                                    "dom-overlay"
                                ],

                                domOverlay: {
                                    root: document.body
                                }
                            }
                        );


                    /*
                     * Entrega a sessão XR para o A-FRAME.
                     */

                    await scene.renderer.xr.setSession(
                        xrSession
                    );


                    /*
                     * Espaço do mundo.
                     */

                    referenceSpace =
                        await xrSession.requestReferenceSpace(
                            "local"
                        );


                    /*
                     * Espaço da câmera.
                     */

                    viewerSpace =
                        await xrSession.requestReferenceSpace(
                            "viewer"
                        );


                    /*
                     * Fonte do HIT TEST.
                     */

                    hitTestSource =
                        await xrSession.requestHitTestSource({
                            space: viewerSpace
                        });


                    startAR.style.display =
                        "none";


                    placeObject.style.display =
                        "block";


                    /*
                     * Sessão terminou.
                     */

                    xrSession.addEventListener(
                        "end",
                        () => {

                            xrSession = null;

                            hitTestSource = null;

                            viewerSpace = null;

                            referenceSpace = null;

                            objetoColocado = false;

                            ultimaPose = null;

                            startAR.style.display =
                                "block";

                            placeObject.style.display =
                                "none";

                        }
                    );


                    /*
                     * Escuta os frames do WebXR.
                     */

                    scene.renderer.xr.setAnimationLoop(
                        atualizarAR
                    );


                }
                catch (erro) {

                    console.error(
                        "Erro ao iniciar AR:",
                        erro
                    );


                    alert(
                        "Não foi possível iniciar a realidade aumentada."
                    );

                }

            }
        );



        /* =========================================================
           ATUALIZAÇÃO DO AR
        ========================================================= */

        function atualizarAR(
            timestamp,
            frame
        ) {

            if (
                !frame ||
                !xrSession ||
                !referenceSpace ||
                !hitTestSource
            ) {

                return;

            }


            /*
             * Procuramos uma superfície somente enquanto
             * o objeto ainda NÃO foi colocado.
             */

            if (!objetoColocado) {

                const resultados =
                    frame.getHitTestResults(
                        hitTestSource
                    );


                if (
                    resultados.length > 0
                ) {

                    const hit =
                        resultados[0];


                    const pose =
                        hit.getPose(
                            referenceSpace
                        );


                    if (pose) {

                        /*
                         * Guardamos a última posição
                         * encontrada.
                         */

                        ultimaPose = pose;

                    }

                }

            }

        }



        /* =========================================================
           COLOCAR OBJETO
        ========================================================= */

        placeObject.addEventListener(
            "click",
            () => {

                if (!ultimaPose) {

                    alert(
                        "Aponte a câmera para uma superfície."
                    );

                    return;

                }


                /*
                 * Pegamos a posição detectada.
                 */

                const position =
                    ultimaPose.transform.position;


                const orientation =
                    ultimaPose.transform.orientation;


                /*
                 * =================================================
                 * AQUI ESTÁ O PONTO MAIS IMPORTANTE
                 * =================================================
                 *
                 * A posição é definida UMA ÚNICA VEZ.
                 *
                 * Depois que objetoColocado = true,
                 * atualizarAR() NÃO modifica mais a posição.
                 */


                objeto.object3D.position.set(
                    position.x,
                    position.y,
                    position.z
                );


                objeto.object3D.quaternion.set(
                    orientation.x,
                    orientation.y,
                    orientation.z,
                    orientation.w
                );


                /*
                 * Modelo aparece.
                 */

                objeto.setAttribute(
                    "visible",
                    "true"
                );


                objetoColocado = true;


                /*
                 * Não precisamos mais do botão.
                 */

                placeObject.style.display =
                    "none";


                console.log(
                    "Objeto fixado no mundo:",
                    position
                );

            }
        );



        /* =========================================================
           MODELO CARREGADO
        ========================================================= */

        modelo.addEventListener(
            "model-loaded",
            () => {

                const mesh =
                    modelo.getObject3D(
                        "mesh"
                    );


                if (!mesh) return;


                /*
                 * Calcula tamanho.
                 */

                const box =
                    new AFRAME.THREE.Box3()
                        .setFromObject(mesh);


                const size =
                    box.getSize(
                        new AFRAME.THREE.Vector3()
                    );


                const maxDim =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                const desiredSize = 3;


                const scaleFactor =
                    desiredSize / maxDim;


                modelo.setAttribute(
                    "scale",
                    {
                        x: scaleFactor,
                        y: scaleFactor,
                        z: scaleFactor
                    }
                );


                initialScale =
                    scaleFactor;

            }
        );



        /* =========================================================
           PINCH
        ========================================================= */

        function getPinchDistance(e) {

            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;


            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }



        window.addEventListener(
            "touchstart",
            e => {

                if (
                    e.touches.length === 2
                ) {

                    pinchStartDistance =
                        getPinchDistance(e);


                    initialScale =
                        modelo.getAttribute(
                            "scale"
                        ).x;

                }

            },
            {
                passive: true
            }
        );



        window.addEventListener(
            "touchmove",
            e => {

                if (
                    e.touches.length !== 2
                ) {

                    return;

                }


                const distancia =
                    getPinchDistance(e);


                const fator =
                    distancia /
                    pinchStartDistance;


                let novaEscala =
                    initialScale *
                    fator;


                if (
                    novaEscala < 0.0001
                ) {

                    novaEscala = 0.0001;

                }


                modelo.setAttribute(
                    "scale",
                    {
                        x: novaEscala,
                        y: novaEscala,
                        z: novaEscala
                    }
                );

            },
            {
                passive: true
            }
        );



        /* =========================================================
           ROTAÇÃO Y
        ========================================================= */

        document
            .querySelector("#rotateLeft")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.y +=
                        AFRAME.THREE.MathUtils.degToRad(3);

                }
            );


        document
            .querySelector("#rotateRight")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.y -=
                        AFRAME.THREE.MathUtils.degToRad(3);

                }
            );



        /* =========================================================
           MOVE Y
        ========================================================= */

        document
            .querySelector("#moveUp")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.position.y +=
                        0.1;

                }
            );


        document
            .querySelector("#moveDown")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.position.y -=
                        0.1;

                }
            );



        /* =========================================================
           PITCH X
        ========================================================= */

        document
            .querySelector("#tiltForward")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.x +=
                        AFRAME.THREE.MathUtils.degToRad(3);

                }
            );


        document
            .querySelector("#tiltBackward")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.x -=
                        AFRAME.THREE.MathUtils.degToRad(3);

                }
            );



        /* =========================================================
           ROLL Z
        ========================================================= */

        document
            .querySelector("#rollRight")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.z +=
                        AFRAME.THREE.MathUtils.degToRad(3);

                }
            );


        document
            .querySelector("#rollLeft")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.z -=
                        AFRAME.THREE.MathUtils.degToRad(3);

                }
            );



        /* =========================================================
           ZOOM IN
        ========================================================= */

        document
            .querySelector("#zoomIn")
            .addEventListener(
                "click",
                () => {

                    let scale =
                        modelo.getAttribute(
                            "scale"
                        ).x;


                    scale +=
                        scale * 0.15;


                    modelo.setAttribute(
                        "scale",
                        {
                            x: scale,
                            y: scale,
                            z: scale
                        }
                    );

                }
            );



        /* =========================================================
           ZOOM OUT
        ========================================================= */

        document
            .querySelector("#zoomOut")
            .addEventListener(
                "click",
                () => {

                    let scale =
                        modelo.getAttribute(
                            "scale"
                        ).x;


                    scale -=
                        scale * 0.15;


                    if (
                        scale < 0.0001
                    ) {

                        scale = 0.0001;

                    }


                    modelo.setAttribute(
                        "scale",
                        {
                            x: scale,
                            y: scale,
                            z: scale
                        }
                    );

                }
            );



        /* =========================================================
           TROCAR MODELO
        ========================================================= */

        const modelButtons =
            document.querySelectorAll(
                ".model-btn"
            );


        modelButtons.forEach(
            btn => {

                btn.addEventListener(
                    "click",
                    () => {

                        modelButtons.forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );


                        btn.classList.add(
                            "active"
                        );


                        const src =
                            btn.dataset.src;


                        modelo.setAttribute(
                            "src",
                            src
                        );


                    }
                );

            }
        );


    </script>

</body>

</html>
