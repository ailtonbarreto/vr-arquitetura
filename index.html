<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- WebXR -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">

    <script src="menu.js" defer></script>
    <script src="hide.js" defer></script>

    <link rel="shortcut icon" href="vr-glasses.ico" type="image/x-icon">

    <title>VR Arquitetura</title>

</head>

<body>

    <!-- MENU -->

    <span
        class="material-symbols-outlined open-menu hide"
        id="open_menu">
        menu
    </span>


    <nav id="menu">

        <span
            class="material-symbols-outlined"
            id="close_menu">
            close
        </span>


        <div id="modelButtons">

            <button
                class="model-btn"
                data-src="./construcao/edificio_1.glb">
                Edifício 1
            </button>

            <button
                class="model-btn"
                data-src="./construcao/edificio_2.glb">
                Edifício 2
            </button>

            <button
                class="model-btn"
                data-src="./construcao/casa_modelo_1.glb">
                Casa Modelo 1
            </button>

            <button
                class="model-btn"
                data-src="./construcao/casa_modelo_2.glb">
                Casa Modelo 2
            </button>

            <button
                class="model-btn"
                data-src="./construcao/eiffel_tower.glb">
                Torre Eiffel
            </button>

            <button
                class="model-btn"
                data-src="./construcao/wtc.glb">
                World Trade Center
            </button>

            <button
                class="model-btn"
                data-src="./construcao/Burj_al_arab.glb">
                Burj Al Arab
            </button>

        </div>

    </nav>


    <!-- ZOOM -->

    <div class="controls-zoom hide">

        <div
            class="btn"
            id="zoomIn">
            ＋
        </div>

        <div
            class="btn"
            id="zoomOut">
            －
        </div>

    </div>


    <!-- ROTAÇÃO Y -->

    <div class="controls-bottom hide">

        <div
            class="btn"
            id="rotateRight">
            ◀️
        </div>

        <div
            class="btn"
            id="rotateLeft">
            ▶️
        </div>

    </div>


    <!-- ROTAÇÃO Z -->

    <div class="controls_rolagem hide">

        <div
            class="btn"
            id="rollLeft">
            🔽
        </div>

        <div
            class="btn"
            id="rollRight">
            🔼
        </div>

    </div>


    <!-- INCLINAÇÃO X -->

    <div class="controls-leftside hide">

        <div
            class="btn"
            id="tiltForward">
            🔼
        </div>

        <div
            class="btn"
            id="tiltBackward">
            🔽
        </div>

    </div>


    <!-- MOVIMENTO VERTICAL -->

    <div class="controls-side hide">

        <div
            class="btn"
            id="moveUp">
            🔼
        </div>

        <div
            class="btn"
            id="moveDown">
            🔽
        </div>

    </div>


    <!-- MOSTRAR / OCULTAR -->

    <div class="controls-zoom">

        <div
            class="material-symbols-outlined"
            id="ocultar">
            visibility_off
        </div>

        <div
            class="material-symbols-outlined"
            id="mostrar"
            style="display: none;">
            visibility
        </div>

    </div>


    <!-- ========================================================= -->
    <!-- BOTÃO PARA ENTRAR NO AR -->
    <!-- ========================================================= -->

    <button
        id="startAR"
        style="
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #2086EB;
            color: white;
            font-size: 16px;
            cursor: pointer;
        ">

        Iniciar realidade aumentada

    </button>


    <!-- ========================================================= -->
    <!-- BOTÃO PARA COLOCAR O MODELO -->
    <!-- ========================================================= -->

    <button
        id="placeObject"
        style="
            display: none;
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #06A95D;
            color: white;
            font-size: 16px;
            cursor: pointer;
        ">

        Colocar modelo aqui

    </button>


    <!-- ========================================================= -->
    <!-- CENA A-FRAME -->
    <!-- ========================================================= -->

    <a-scene
        id="scene"
        vr-mode-ui="enabled: false"
        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
            antialias: true;
        "
        embedded
        webxr="
            optionalFeatures:
            hit-test;
            dom-overlay;
            local-floor;
        "
    >


        <!-- MODELO -->

        <a-entity
            id="objeto"
            visible="false"
            position="0 0 -2"
            rotation="0 0 0">

            <a-gltf-model
                id="modelo"
                src=""
                scale="1 1 1">
            </a-gltf-model>

        </a-entity>


        <!-- CÂMERA -->

        <a-camera
            id="camera"
            position="0 1.6 0">
        </a-camera>


    </a-scene>


    <!-- ========================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================= -->

    <script>

        /* =========================================================
           VARIÁVEIS
        ========================================================= */

        const scene = document.querySelector("#scene");

        const objeto = document.querySelector("#objeto");

        const modelo = document.querySelector("#modelo");

        const camera = document.querySelector("#camera");

        const startAR = document.querySelector("#startAR");

        const placeObject = document.querySelector("#placeObject");


        let xrSession = null;

        let hitTestSource = null;

        let localReferenceSpace = null;

        let objetoColocado = false;

        let modeloCarregado = false;


        let initialScale = 1;

        let pinchStartDistance = 0;

        let dragging = false;


        /* =========================================================
           VERIFICAR WEBXR
        ========================================================= */

        async function verificarWebXR() {

            if (!navigator.xr) {

                alert(
                    "Este navegador não oferece suporte ao WebXR."
                );

                return false;
            }


            const suportado =
                await navigator.xr.isSessionSupported(
                    "immersive-ar"
                );


            if (!suportado) {

                alert(
                    "Este dispositivo ou navegador não suporta AR espacial."
                );

                return false;
            }


            return true;

        }


        /* =========================================================
           INICIAR AR
        ========================================================= */

        startAR.addEventListener("click", async () => {

            const suportado = await verificarWebXR();

            if (!suportado) return;


            try {

                xrSession =
                    await navigator.xr.requestSession(
                        "immersive-ar",
                        {
                            requiredFeatures: [
                                "hit-test"
                            ],

                            optionalFeatures: [
                                "local-floor",
                                "dom-overlay"
                            ],

                            domOverlay: {
                                root: document.body
                            }

                        }
                    );


                startAR.style.display = "none";

                placeObject.style.display = "block";


                /* -------------------------------------------------
                   A-FRAME ENTRA NA SESSÃO XR
                ------------------------------------------------- */

                scene.renderer.xr.setSession(
                    xrSession
                );


                /* -------------------------------------------------
                   ESPAÇO DE REFERÊNCIA
                ------------------------------------------------- */

                localReferenceSpace =
                    await xrSession.requestReferenceSpace(
                        "local"
                    );


                /* -------------------------------------------------
                   HIT TEST
                ------------------------------------------------- */

                const viewerSpace =
                    await xrSession.requestReferenceSpace(
                        "viewer"
                    );


                hitTestSource =
                    await xrSession.requestHitTestSource({
                        space: viewerSpace
                    });


                /* -------------------------------------------------
                   FINALIZAR SESSÃO
                ------------------------------------------------- */

                xrSession.addEventListener(
                    "end",
                    () => {

                        xrSession = null;

                        hitTestSource = null;

                        objetoColocado = false;

                        startAR.style.display = "block";

                        placeObject.style.display = "none";

                    }
                );


                /* -------------------------------------------------
                   LOOP XR
                ------------------------------------------------- */

                scene.renderer.setAnimationLoop(
                    renderXR
                );

            } catch (erro) {

                console.error(
                    "Erro ao iniciar AR:",
                    erro
                );

                alert(
                    "Não foi possível iniciar a realidade aumentada."
                );

            }

        });


        /* =========================================================
           LOOP DO AR
        ========================================================= */

        function renderXR(
            timestamp,
            frame
        ) {

            if (!frame || !xrSession) return;


            const referenceSpace =
                localReferenceSpace;


            /* -----------------------------------------------------
               PROCURAR SUPERFÍCIE
            ----------------------------------------------------- */

            if (
                hitTestSource &&
                !objetoColocado
            ) {

                const hitTestResults =
                    frame.getHitTestResults(
                        hitTestSource
                    );


                if (
                    hitTestResults.length > 0
                ) {

                    const hit =
                        hitTestResults[0];


                    const pose =
                        hit.getPose(
                            referenceSpace
                        );


                    if (pose) {

                        /*
                         * Aqui NÃO colocamos o objeto.
                         *
                         * Apenas mostramos uma posição
                         * provisória no centro do ambiente.
                         */

                    }

                }

            }


            /* -----------------------------------------------------
               RENDER
            ----------------------------------------------------- */

            scene.renderer.render(
                scene.object3D,
                camera.object3D
            );

        }


        /* =========================================================
           COLOCAR MODELO NO MUNDO
        ========================================================= */

        placeObject.addEventListener(
            "click",
            async () => {

                if (!xrSession) return;


                if (!hitTestSource) {

                    alert(
                        "Não foi detectada nenhuma superfície."
                    );

                    return;

                }


                /*
                 * Pega o frame atual.
                 */

                const frame =
                    scene.renderer.xr.getFrame();


                if (!frame) {

                    return;

                }


                const results =
                    frame.getHitTestResults(
                        hitTestSource
                    );


                if (results.length === 0) {

                    alert(
                        "Aponte o celular para uma superfície."
                    );

                    return;

                }


                const hit =
                    results[0];


                const pose =
                    hit.getPose(
                        localReferenceSpace
                    );


                if (!pose) return;


                /* -------------------------------------------------
                   POSIÇÃO NO MUNDO REAL
                ------------------------------------------------- */

                const position =
                    pose.transform.position;


                const orientation =
                    pose.transform.orientation;


                /*
                 * IMPORTANTE:
                 *
                 * A posição abaixo é aplicada UMA ÚNICA VEZ.
                 *
                 * Depois disso não alteramos mais a posição
                 * do objeto quando a câmera se movimenta.
                 */

                objeto.object3D.position.set(
                    position.x,
                    position.y,
                    position.z
                );


                objeto.object3D.quaternion.set(
                    orientation.x,
                    orientation.y,
                    orientation.z,
                    orientation.w
                );


                objeto.setAttribute(
                    "visible",
                    true
                );


                objetoColocado = true;


                placeObject.style.display =
                    "none";


                console.log(
                    "Modelo colocado no mundo:",
                    position
                );

            }
        );


        /* =========================================================
           MODELO CARREGADO
        ========================================================= */

        modelo.addEventListener(
            "model-loaded",
            () => {

                modeloCarregado = true;


                const obj =
                    modelo.getObject3D(
                        "mesh"
                    );


                if (!obj) return;


                /* -------------------------------------------------
                   CALCULAR TAMANHO DO MODELO
                ------------------------------------------------- */

                const box =
                    new THREE.Box3()
                        .setFromObject(obj);


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const maxDim =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                /*
                 * Tamanho desejado
                 */

                const desiredSize = 3;


                const scaleFactor =
                    desiredSize / maxDim;


                modelo.setAttribute(
                    "scale",
                    {
                        x: scaleFactor,
                        y: scaleFactor,
                        z: scaleFactor
                    }
                );


                initialScale =
                    scaleFactor;

            }
        );


        /* =========================================================
           ZOOM TOUCH
        ========================================================= */

        function getPinchDistance(e) {

            const dx =
                e.touches[0].clientX -
                e.touches[1].clientX;


            const dy =
                e.touches[0].clientY -
                e.touches[1].clientY;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }


        window.addEventListener(
            "touchstart",
            e => {

                if (
                    e.touches.length === 2
                ) {

                    pinchStartDistance =
                        getPinchDistance(e);


                    initialScale =
                        modelo.getAttribute(
                            "scale"
                        ).x;

                }

            },
            {
                passive: true
            }
        );


        window.addEventListener(
            "touchmove",
            e => {

                if (
                    e.touches.length !== 2
                ) return;


                const pinchDistance =
                    getPinchDistance(e);


                const scaleFactor =
                    pinchDistance /
                    pinchStartDistance;


                let newScale =
                    initialScale *
                    scaleFactor;


                if (newScale < 0.0001) {

                    newScale = 0.0001;

                }


                modelo.setAttribute(
                    "scale",
                    {
                        x: newScale,
                        y: newScale,
                        z: newScale
                    }
                );

            },
            {
                passive: true
            }
        );


        /* =========================================================
           ROTAÇÃO Y
        ========================================================= */

        document
            .querySelector("#rotateLeft")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.y +=
                        THREE.MathUtils.degToRad(3);

                }
            );


        document
            .querySelector("#rotateRight")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.y -=
                        THREE.MathUtils.degToRad(3);

                }
            );


        /* =========================================================
           MOVE Y
        ========================================================= */

        document
            .querySelector("#moveUp")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.position.y +=
                        0.1;

                }
            );


        document
            .querySelector("#moveDown")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.position.y -=
                        0.1;

                }
            );


        /* =========================================================
           PITCH X
        ========================================================= */

        document
            .querySelector("#tiltForward")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.x +=
                        THREE.MathUtils.degToRad(3);

                }
            );


        document
            .querySelector("#tiltBackward")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.x -=
                        THREE.MathUtils.degToRad(3);

                }
            );


        /* =========================================================
           ROLL Z
        ========================================================= */

        document
            .querySelector("#rollRight")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.z +=
                        THREE.MathUtils.degToRad(3);

                }
            );


        document
            .querySelector("#rollLeft")
            .addEventListener(
                "click",
                () => {

                    objeto.object3D.rotation.z -=
                        THREE.MathUtils.degToRad(3);

                }
            );


        /* =========================================================
           ZOOM
        ========================================================= */

        document
            .querySelector("#zoomIn")
            .addEventListener(
                "click",
                () => {

                    let scale =
                        modelo.getAttribute(
                            "scale"
                        ).x;


                    scale +=
                        scale * 0.15;


                    modelo.setAttribute(
                        "scale",
                        {
                            x: scale,
                            y: scale,
                            z: scale
                        }
                    );

                }
            );


        document
            .querySelector("#zoomOut")
            .addEventListener(
                "click",
                () => {

                    let scale =
                        modelo.getAttribute(
                            "scale"
                        ).x;


                    scale -=
                        scale * 0.15;


                    if (
                        scale < 0.0001
                    ) {

                        scale = 0.0001;

                    }


                    modelo.setAttribute(
                        "scale",
                        {
                            x: scale,
                            y: scale,
                            z: scale
                        }
                    );

                }
            );


        /* =========================================================
           SELEÇÃO DOS MODELOS
        ========================================================= */

        const modelButtons =
            document.querySelectorAll(
                ".model-btn"
            );


        modelButtons.forEach(
            btn => {

                btn.addEventListener(
                    "click",
                    () => {

                        /* -----------------------------------------
                           ACTIVE
                        ----------------------------------------- */

                        modelButtons.forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );


                        btn.classList.add(
                            "active"
                        );


                        /* -----------------------------------------
                           URL
                        ----------------------------------------- */

                        const newModelURL =
                            btn.dataset.src;


                        /* -----------------------------------------
                           CARREGAR
                        ----------------------------------------- */

                        modelo.setAttribute(
                            "src",
                            newModelURL
                        );


                        /*
                         * IMPORTANTE:
                         *
                         * NÃO resetamos a posição.
                         *
                         * O novo modelo ocupa exatamente
                         * o mesmo lugar do modelo anterior.
                         */


                        objetoColocado = true;


                        objeto.setAttribute(
                            "visible",
                            true
                        );

                    }
                );

            }
        );


        /* =========================================================
           MODELO INICIAL
        ========================================================= */

        modelo.setAttribute(
            "src",
            "./construcao/edificio_1.glb"
        );


    </script>

</body>

</html>
