<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../menu.css">
    <script src="../menu.js" defer></script>
    <style>
        #navigationPanel {
            position: fixed;
            z-index: 9998;
            left: 50%;
            bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(440px, calc(100% - 32px));
            padding: 14px;
            color: #fff;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            font-family: Arial, sans-serif;
            transform: translateX(-50%);
            backdrop-filter: blur(8px);
        }

        .direction-orb {
            display: grid;
            flex: 0 0 58px;
            width: 58px;
            height: 58px;
            place-items: center;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 50%;
        }

        #directionArrow {
            width: 30px;
            height: 38px;
            background: #45d6ff;
            clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%);
            filter: drop-shadow(0 0 5px rgba(69, 214, 255, 0.8));
            transform: rotate(0deg);
            transition: transform 180ms ease-out;
        }

        .navigation-copy {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            gap: 5px;
        }

        #navigationDistance {
            font-size: 17px;
        }

        #navigationStatus {
            color: #d1d5db;
            font-size: 13px;
            line-height: 1.3;
        }

        #navigationButton {
            min-height: 42px;
            padding: 0 13px;
            color: #06202a;
            background: #45d6ff;
            border: 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #navigationButton:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        @media (max-width: 420px) {
            #navigationPanel {
                gap: 10px;
                padding: 11px;
            }

            .direction-orb {
                flex-basis: 48px;
                width: 48px;
                height: 48px;
            }

            #navigationButton {
                padding: 0 10px;
                font-size: 13px;
            }
        }
    </style>
    <title>AR com GPS</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <span class="material-symbols-outlined open-menu" id="open_menu" aria-label="Abrir menu">menu</span>

    <nav id="menu" aria-label="Selecionar modelo">
        <span class="material-symbols-outlined" id="close_menu" aria-label="Fechar menu">close</span>

        <div id="modelButtons">
            <button class="model-btn" data-src="../construcao/edificio_1.glb">Edifício 1</button>
            <button class="model-btn" data-src="../construcao/edificio_2.glb">Edifício 2</button>
            <button class="model-btn" data-src="../construcao/projeto_estrutural.glb">Projeto Estrutural</button>
            <button class="model-btn" data-src="../construcao/casa_modelo_1.glb">Casa Modelo 1</button>
            <button class="model-btn" data-src="../construcao/casa_modelo_2.glb">Casa Modelo 2</button>
            <button class="model-btn" data-src="../construcao/modelo_casa_concreto.glb">Casa Modelo 3</button>
            <button class="model-btn" data-src="../construcao/casa_modelo_4.glb">Casa Modelo 4</button>
            <button class="model-btn" data-src="../construcao/casa_modelo_5.glb">Casa Modelo 5</button>
            <button class="model-btn active" data-src="../construcao/eiffel_tower.glb">Torre Eiffel</button>
            <button class="model-btn" data-src="../construcao/wtc.glb">World Trade Center</button>
            <button class="model-btn" data-src="../construcao/sears_tower.glb">Sears Tower</button>
            <button class="model-btn" data-src="../construcao/torre_picasso_madrid.glb">Torre Picasso</button>
            <button class="model-btn" data-src="../construcao/Burj_al_arab.glb">Burj Al Arab</button>
        </div>
    </nav>

    <section id="navigationPanel" aria-label="Navegação até o objeto">
        <div class="direction-orb" aria-hidden="true">
            <span id="directionArrow"></span>
        </div>
        <div class="navigation-copy">
            <strong id="navigationDistance">Destino definido</strong>
            <span id="navigationStatus" role="status" aria-live="polite">
                Inicie para apontar a seta na direção do objeto.
            </span>
        </div>
        <button id="navigationButton" type="button">Iniciar</button>
    </section>

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
        <a-camera gps-camera rotation-reader></a-camera>

        <a-entity id="objeto"
            gps-entity-place="latitude: -20.546606; longitude: -47.4173892; altitude: 210">
            <a-gltf-model id="modelo" src="../construcao/eiffel_tower.glb" scale="2 2 2"
                rotation="0 45 0"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const modelo = document.querySelector("#modelo");
        const modelMenu = document.querySelector("#menu");
        const modelButtons = document.querySelectorAll(".model-btn");
        const navigationButton = document.querySelector("#navigationButton");
        const navigationStatus = document.querySelector("#navigationStatus");
        const navigationDistance = document.querySelector("#navigationDistance");
        const directionArrow = document.querySelector("#directionArrow");
        let currentPosition = null;
        let currentHeading = null;
        let locationWatchId = null;
        let navigationActive = false;
        let locationError = null;
        let compassMessage = "Aponte o topo do celular para encontrar a direção.";

        modelButtons.forEach(button => {
            button.addEventListener("click", () => {
                modelo.setAttribute("src", button.dataset.src);
                modelButtons.forEach(item => item.classList.remove("active"));
                button.classList.add("active");
                modelMenu.classList.remove("open");
            });
        });

        function normalizeAngle(angle) {
            return (angle % 360 + 360) % 360;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const toRad = angle => angle * Math.PI / 180;
            const toDegrees = angle => angle * 180 / Math.PI;
            const deltaLon = toRad(lon2 - lon1);
            const y = Math.sin(deltaLon) * Math.cos(toRad(lat2));
            const x =
                Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(deltaLon);

            return normalizeAngle(toDegrees(Math.atan2(y, x)));
        }

        function getDestination() {
            const gpsPlace = document.querySelector("#objeto").components["gps-entity-place"];
            return gpsPlace && gpsPlace.attrValue;
        }

        function updateNavigation() {
            if (!currentPosition) {
                navigationDistance.textContent = "Aguardando GPS...";
                navigationStatus.textContent = locationError || "Obtendo sua localização.";
                return;
            }

            const destination = getDestination();
            if (!destination) {
                navigationStatus.textContent = "Não foi possível localizar o destino.";
                return;
            }

            const distance = calcularDistancia(
                currentPosition.latitude,
                currentPosition.longitude,
                destination.latitude,
                destination.longitude
            );
            navigationDistance.textContent = distance < 1000
                ? `${distance.toFixed(0)} m`
                : `${(distance / 1000).toFixed(2)} km`;

            if (locationError) {
                navigationStatus.textContent = locationError;
                return;
            }

            if (distance < 10) {
                navigationStatus.textContent = "Você chegou ao objeto!";
                return;
            }

            if (currentHeading === null) {
                navigationStatus.textContent = compassMessage;
                return;
            }

            const bearing = calculateBearing(
                currentPosition.latitude,
                currentPosition.longitude,
                destination.latitude,
                destination.longitude
            );
            directionArrow.style.transform = `rotate(${normalizeAngle(bearing - currentHeading)}deg)`;
            navigationStatus.textContent = "Siga a seta até o objeto.";
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading;

            if (!Number.isFinite(heading) && event.absolute && Number.isFinite(event.alpha)) {
                const screenAngle = window.screen.orientation
                    ? window.screen.orientation.angle
                    : 0;
                heading = 360 - event.alpha + screenAngle;
            }

            if (Number.isFinite(heading)) {
                currentHeading = normalizeAngle(heading);
                updateNavigation();
            }
        }

        function stopNavigation(statusMessage) {
            if (locationWatchId !== null) {
                navigator.geolocation.clearWatch(locationWatchId);
                locationWatchId = null;
            }

            window.removeEventListener("deviceorientation", handleOrientation);
            window.removeEventListener("deviceorientationabsolute", handleOrientation);
            currentHeading = null;
            directionArrow.style.transform = "rotate(0deg)";
            navigationActive = false;
            navigationButton.disabled = false;
            navigationButton.textContent = "Iniciar";
            locationError = statusMessage || null;
            updateNavigation();
        }

        async function startNavigation() {
            navigationButton.disabled = true;
            navigationStatus.textContent = "Solicitando acesso ao GPS e à bússola...";
            locationError = null;

            if (typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function") {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === "granted") {
                        compassMessage = "Aponte o topo do celular para encontrar a direção.";
                    } else {
                        compassMessage = "Permita o acesso à orientação do aparelho para usar a seta.";
                    }
                } catch (error) {
                    compassMessage = "Não foi possível ativar a bússola. Verifique a permissão do aparelho.";
                }
            } else if (typeof DeviceOrientationEvent === "undefined") {
                compassMessage = "Este aparelho ou navegador não disponibiliza bússola.";
            }

            if (!navigator.geolocation) {
                stopNavigation("Este navegador não disponibiliza localização GPS.");
                return;
            }

            window.addEventListener("deviceorientation", handleOrientation);
            window.addEventListener("deviceorientationabsolute", handleOrientation);
            navigationActive = true;
            navigationButton.disabled = false;
            navigationButton.textContent = "Parar";
            navigationStatus.textContent = "Obtendo sua localização...";

            try {
                locationWatchId = navigator.geolocation.watchPosition(position => {
                    currentPosition = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };
                    locationError = null;
                    updateNavigation();
                }, error => {
                    const messages = {
                        1: "Permita o acesso à localização para iniciar a navegação.",
                        2: "Sua localização não está disponível. Tente novamente em um local aberto.",
                        3: "O GPS demorou para responder. Verifique o sinal e tente novamente."
                    };
                    locationError = messages[error.code] || "Não foi possível obter sua localização.";
                    updateNavigation();
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 15000
                });
            } catch (error) {
                stopNavigation("Falha ao iniciar o GPS. Verifique as permissões e tente novamente.");
                return;
            }

            updateNavigation();
        }

        navigationButton.addEventListener("click", () => {
            if (navigationActive) {
                stopNavigation("Navegação pausada.");
                return;
            }

            startNavigation();
        });

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const toRad = x => x * Math.PI / 180;

            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);

            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        window.addEventListener('gps-camera-update-position', e => {
            const userLat = e.detail.position.latitude;
            const userLon = e.detail.position.longitude;

            currentPosition = { latitude: userLat, longitude: userLon };
            updateNavigation();
        });
    </script>

</body>

</html>
